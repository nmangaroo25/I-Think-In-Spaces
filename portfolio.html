<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- SEO Essentials -->
<title>I Think In Spaces Portfolio | MBE Architectural Consultancy</title>
<meta name="description" content="Technical architectural portfolio showcasing BIM coordination, technical documentation, and pre-construction services by I Think In Spaces, LLC.">
<meta name="keywords" content="architectural portfolio, BIM coordination NYC, technical documentation, MBE certified, NYC architecture">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://nmangaroo25.github.io/I-Think-In-Spaces/portfolio.html">

<!-- Open Graph -->
<meta property="og:title" content="I Think In Spaces Portfolio">
<meta property="og:description" content="Explore our technical project delivery: BIM coordination and architectural support.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nmangaroo25.github.io/I-Think-In-Spaces/portfolio.html">
<meta property="og:image" content="assets/img/og-image.jpg">

<style>
  :root{--bg:#1a1c1e;--card:#ffffff;--muted:#a1aab4;--accent:#0077cc;}
  html, body{height:100%;margin:0;font-family:'Inter', sans-serif;background:var(--bg);color:#fff;overflow:hidden;}
  
  /* Navigation Bar */
  .nav-ui {position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(0,0,0,0.8); backdrop-filter:blur(10px); z-index:10000; border-bottom:1px solid rgba(255,255,255,0.1);}
  
  a.back{color:#fff; text-decoration:none; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;}
  a.back:hover{color:var(--accent);}

  .controls{display:flex; gap:12px; align-items:center;}
  .btn{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.2s;}
  .btn:hover{background:var(--accent); border-color:var(--accent);}
  
  .pager{display:flex; align-items:center; background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.1);}
  #pageNum{width:45px; background:transparent; border:none; color:#fff; font-weight:700; text-align:center; font-size:16px;}
  #pageTotal{color:var(--muted); font-size:14px; margin-left:4px;}

  /* Flipbook Area */
  #flipbook-wrap{height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; padding-top:60px; box-sizing:border-box;}
  #flipbook{transform-origin: center center; transition: transform 0.1s ease-out;}
  .page{background:var(--card); box-shadow:0 0 20px rgba(0,0,0,0.5);}
  canvas{width:100%; height:100%; display:block;}

  #status-msg{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(0,0,0,0.7); padding:8px 16px; border-radius:20px; font-size:12px; color:var(--muted); z-index:10000;}

  @media (max-width: 768px) {
    .nav-ui { height:50px; padding:0 10px; }
    #flipbook-wrap { padding-top:50px; }
  }
</style>
</head>
<body>

<div class="nav-ui">
  <a class="back" href="index.html">← Back to Site</a>
  
  <div class="controls">
    <div class="pager">
      <button id="prev" class="btn" style="background:none; border:none; padding:0 10px;">‹</button>
      <input id="pageNum" type="number" value="1">
      <span id="pageTotal">/ 0</span>
      <button id="next" class="btn" style="background:none; border:none; padding:0 10px;">›</button>
    </div>
    
    <div class="zoom-group" style="display:flex; gap:5px;">
      <button id="zoomOut" class="btn">−</button>
      <button id="zoomIn" class="btn">＋</button>
    </div>
  </div>
</div>

<div id="flipbook-wrap">
  <div id="flipbook"></div>
</div>

<div id="status-msg">Initialising High-Resolution Render...</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/0.11/turn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

(async function(){
  const url = "Norris_Mangaroo_Arch_Portfolio.pdf";
  const flipbookEl = $('#flipbook');
  let currentZoom = 1;
  let pdfDoc = null;

  try {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    const totalPages = pdfDoc.numPages;
    $('#pageTotal').text('/ ' + totalPages);

    // CRITICAL: Increased scale for clarity. 2.0 or 3.0 provides "Retina" quality.
    const renderScale = 2.5; 

    for(let i=1; i<=totalPages; i++){
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({scale: renderScale});
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({canvasContext: ctx, viewport: viewport}).promise;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      // We display at a standard CSS width but the canvas inside is high-res
      pageDiv.style.width = (viewport.width / renderScale) + 'px';
      pageDiv.style.height = (viewport.height / renderScale) + 'px';
      pageDiv.appendChild(canvas);
      flipbookEl.append(pageDiv);
    }

    const firstPage = flipbookEl.find('.page')[0];
    const pW = parseFloat(firstPage.style.width);
    const pH = parseFloat(firstPage.style.height);
    const isMobile = window.innerWidth < 768;

    flipbookEl.turn({
      width: isMobile ? pW : pW * 2,
      height: pH,
      display: isMobile ? 'single' : 'double',
      autoCenter: true,
      acceleration: true,
      elevation: 50,
      gradients: true,
      duration: 600
    });

    // Navigation Logic
    $('#prev').click(() => flipbookEl.turn('previous'));
    $('#next').click(() => flipbookEl.turn('next'));
    $('#pageNum').on('change', function() {
      flipbookEl.turn('page', $(this).val());
    });
    flipbookEl.bind('turned', (e, p) => $('#pageNum').val(p));

    // Zoom Logic
    function applyZoom() { 
      flipbookEl.css('transform', `scale(${currentZoom})`); 
    }
    $('#zoomIn').click(() => { currentZoom = Math.min(3, currentZoom + 0.2); applyZoom(); });
    $('#zoomOut').click(() => { currentZoom = Math.max(0.2, currentZoom - 0.2); applyZoom(); });

    // Responsive Fit
    function autoFit() {
      const vW = window.innerWidth * 0.9;
      const vH = (window.innerHeight - 80) * 0.9;
      const isMob = window.innerWidth < 768;
      const bookW = isMob ? pW : pW * 2;
      const scaleW = vW / bookW;
      const scaleH = vH / pH;
      currentZoom = Math.min(scaleW, scaleH);
      flipbookEl.turn('display', isMob ? 'single' : 'double');
      flipbookEl.turn('size', isMob ? pW : pW * 2, pH);
      applyZoom();
    }

    $(window).on('resize', autoFit);
    autoFit();

    $('#status-msg').fadeOut();

  } catch(e) {
    console.error(e);
    $('#status-msg').text('Error loading PDF. Please check file path.');
  }
})();
</script>
</body>
</html>
