<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>I Think In Spaces Portfolio | MBE Architectural Consultancy</title>
<meta name="description" content="Technical architectural portfolio showcasing BIM coordination and pre-construction services.">

<style>
  :root{--bg:#1a1c1e;--card:#ffffff;--muted:#a1aab4;--accent:#0077cc;}
  html, body{height:100%;margin:0;font-family:'Inter', sans-serif;background:var(--bg);color:#fff;overflow:hidden;}
  
  .nav-ui {position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); z-index:10000; border-bottom:1px solid rgba(255,255,255,0.1);}
  
  a.back{color:#fff; text-decoration:none; font-weight:600; font-size:14px;}
  a.back:hover{color:var(--accent);}

  .controls{display:flex; gap:12px; align-items:center;}
  .btn{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.2s;}
  .btn:hover{background:var(--accent); border-color:var(--accent);}
  
  .pager{display:flex; align-items:center; background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.1);}
  #pageNum{width:45px; background:transparent; border:none; color:#fff; font-weight:700; text-align:center; font-size:16px;}
  #pageTotal{color:var(--muted); font-size:14px; margin-left:4px;}

  /* Removed extra padding to allow the book to touch the nav/bottom */
  #flipbook-wrap{height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; padding-top:60px; box-sizing:border-box; overflow:visible;}
  
  #flipbook{transform-origin: center center; display: block !important;}
  
  .page{background:var(--card); box-shadow:0 0 50px rgba(0,0,0,0.8); overflow:hidden !important;}
  canvas{width:100% !important; height:100% !important; object-fit: contain !important; display:block;}

  #status-msg{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:8px 20px; border-radius:30px; font-size:13px; color:#fff; z-index:10000; border:1px solid var(--accent);}
</style>
</head>
<body>

<div class="nav-ui">
  <a class="back" href="index.html">← Back to Site</a>
  
  <div class="controls">
    <div class="pager">
      <button id="prev" class="btn" style="background:none; border:none; padding:0 10px;">‹</button>
      <input id="pageNum" type="number" value="1">
      <span id="pageTotal">/ 0</span>
      <button id="next" class="btn" style="background:none; border:none; padding:0 10px;">›</button>
    </div>
    
    <div class="zoom-group" style="display:flex; gap:5px;">
      <button id="zoomOut" class="btn">−</button>
      <button id="zoomIn" class="btn">＋</button>
    </div>
  </div>
</div>

<div id="flipbook-wrap">
  <div id="flipbook"></div>
</div>

<div id="status-msg">Optimizing Architectural Render...</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/0.11/turn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

(async function(){
  const url = "Norris_Mangaroo_Arch_Portfolio.pdf";
  const flipbookEl = $('#flipbook');
  let currentZoom = 1;
  let pdfDoc = null;

  try {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    const totalPages = pdfDoc.numPages;
    $('#pageTotal').text('/ ' + totalPages);

    const renderScale = 3.0; 

    for(let i=1; i<=totalPages; i++){
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({scale: renderScale});
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({canvasContext: ctx, viewport: viewport}).promise;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      
      const displayWidth = viewport.width / renderScale;
      const displayHeight = viewport.height / renderScale;
      
      pageDiv.style.width = displayWidth + 'px';
      pageDiv.style.height = displayHeight + 'px';
      
      pageDiv.appendChild(canvas);
      flipbookEl.append(pageDiv);
    }

    const firstPage = flipbookEl.find('.page')[0];
    const spreadW = parseFloat(firstPage.style.width);
    const spreadH = parseFloat(firstPage.style.height);

    flipbookEl.turn({
      width: spreadW,
      height: spreadH,
      display: 'single', 
      autoCenter: true,
      acceleration: true,
      gradients: true,
      duration: 800
    });

    $('#prev').click(() => flipbookEl.turn('previous'));
    $('#next').click(() => flipbookEl.turn('next'));
    $('#pageNum').on('change', function() {
      flipbookEl.turn('page', $(this).val());
    });
    flipbookEl.bind('turned', (e, p) => $('#pageNum').val(p));

    function applyZoom() { 
      flipbookEl.css('transform', `scale(${currentZoom})`); 
    }

    function autoFit() {
      // THE FIX: We ignore the width and force the height to take up 100% of the space below the nav
      const availableHeight = window.innerHeight - 60;
      
      // Calculate zoom based strictly on height to remove top/bottom bars
      currentZoom = availableHeight / spreadH;
      
      // If the resulting width is way too wide for the screen, we nudge it back slightly 
      // but the priority remains vertical coverage.
      const resultingWidth = spreadW * currentZoom;
      if (resultingWidth > window.innerWidth * 1.5) {
         currentZoom = (window.innerWidth * 1.5) / spreadW;
      }
      
      flipbookEl.turn('size', spreadW, spreadH);
      applyZoom();
    }

    $('#zoomIn').click(() => { currentZoom *= 1.1; applyZoom(); });
    $('#zoomOut').click(() => { currentZoom /= 1.1; applyZoom(); });

    $(window).on('resize', autoFit);
    setTimeout(autoFit, 700); 

    $('#status-msg').fadeOut();

  } catch(e) {
    console.error(e);
    $('#status-msg').text('Error loading PDF.');
  }
})();
</script>
</body>
</html>
