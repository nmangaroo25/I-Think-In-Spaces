<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>I Think In Spaces Portfolio | MBE Architectural Consultancy</title>
<meta name="description" content="Technical architectural portfolio by I Think In Spaces, LLC.">
<meta name="robots" content="index, follow">

<style>
  :root{--bg:#1a1c1e;--card:#ffffff;--muted:#a1aab4;--accent:#0077cc;}
  html, body{height:100%;margin:0;font-family:'Inter', sans-serif;background:var(--bg);color:#fff;overflow:hidden;}
  
  .nav-ui {position:fixed; top:0; left:0; right:0; height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:10000; border-bottom:1px solid rgba(255,255,255,0.1);}
  
  a.back{color:#fff; text-decoration:none; font-weight:600; font-size:14px;}
  a.back:hover{color:var(--accent);}

  .controls{display:flex; gap:12px; align-items:center;}
  .btn{background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:8px 14px; border-radius:6px; font-weight:600; cursor:pointer; transition:0.2s;}
  .btn:hover{background:var(--accent); border-color:var(--accent);}
  
  .pager{display:flex; align-items:center; background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.1);}
  #pageNum{width:45px; background:transparent; border:none; color:#fff; font-weight:700; text-align:center; font-size:16px;}
  #pageTotal{color:var(--muted); font-size:14px; margin-left:4px;}

  #flipbook-wrap{height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; padding-top:60px; box-sizing:border-box;}
  #flipbook{transform-origin: center center;}
  
  /* Page Styling - Improved for Landscape */
  .page{background:var(--card); box-shadow:0 0 30px rgba(0,0,0,0.6); overflow:hidden;}
  canvas{width:100%; height:100%; display:block;}

  #status-msg{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(0,0,0,0.8); padding:8px 20px; border-radius:30px; font-size:13px; color:#fff; z-index:10000; border:1px solid var(--accent);}
</style>
</head>
<body>

<div class="nav-ui">
  <a class="back" href="index.html">← Back to Site</a>
  
  <div class="controls">
    <div class="pager">
      <button id="prev" class="btn" style="background:none; border:none; padding:0 10px;">‹</button>
      <input id="pageNum" type="number" value="1">
      <span id="pageTotal">/ 0</span>
      <button id="next" class="btn" style="background:none; border:none; padding:0 10px;">›</button>
    </div>
    
    <div class="zoom-group" style="display:flex; gap:5px;">
      <button id="zoomOut" class="btn">−</button>
      <button id="zoomIn" class="btn">＋</button>
    </div>
  </div>
</div>

<div id="flipbook-wrap">
  <div id="flipbook"></div>
</div>

<div id="status-msg">Optimizing Architectural Render...</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/0.11/turn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

(async function(){
  const url = "Norris_Mangaroo_Arch_Portfolio.pdf";
  const flipbookEl = $('#flipbook');
  let currentZoom = 1;
  let pdfDoc = null;

  try {
    pdfDoc = await pdfjsLib.getDocument(url).promise;
    const totalPages = pdfDoc.numPages;
    $('#pageTotal').text('/ ' + totalPages);

    // High DPI Scale
    const renderScale = 2.5; 

    for(let i=1; i<=totalPages; i++){
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({scale: renderScale});
      
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({canvasContext: ctx, viewport: viewport}).promise;

      const pageDiv = document.createElement('div');
      pageDiv.className = 'page';
      pageDiv.style.width = (viewport.width / renderScale) + 'px';
      pageDiv.style.height = (viewport.height / renderScale) + 'px';
      pageDiv.appendChild(canvas);
      flipbookEl.append(pageDiv);
    }

    const firstPage = flipbookEl.find('.page')[0];
    const pW = parseFloat(firstPage.style.width);
    const pH = parseFloat(firstPage.style.height);

    // FORCE SINGLE PAGE DISPLAY to prevent landscape squeezing
    flipbookEl.turn({
      width: pW,
      height: pH,
      display: 'single', 
      autoCenter: true,
      acceleration: true,
      elevation: 50,
      gradients: true,
      duration: 600
    });

    $('#prev').click(() => flipbookEl.turn('previous'));
    $('#next').click(() => flipbookEl.turn('next'));
    $('#pageNum').on('change', function() {
      flipbookEl.turn('page', $(this).val());
    });
    flipbookEl.bind('turned', (e, p) => $('#pageNum').val(p));

    function applyZoom() { 
      flipbookEl.css('transform', `scale(${currentZoom})`); 
    }
    $('#zoomIn').click(() => { currentZoom = Math.min(3, currentZoom + 0.2); applyZoom(); });
    $('#zoomOut').click(() => { currentZoom = Math.max(0.2, currentZoom - 0.2); applyZoom(); });

    function autoFit() {
      const vW = window.innerWidth * 0.92;
      const vH = (window.innerHeight - 80) * 0.92;
      
      // Calculate best fit for landscape page
      const scaleW = vW / pW;
      const scaleH = vH / pH;
      currentZoom = Math.min(scaleW, scaleH);
      
      flipbookEl.turn('size', pW, pH);
      applyZoom();
    }

    $(window).on('resize', autoFit);
    autoFit();

    $('#status-msg').fadeOut();

  } catch(e) {
    console.error(e);
    $('#status-msg').text('Error loading PDF.');
  }
})();
</script>
</body>
</html>
